<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TCGコレクション</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #131b2e;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #6366f1;
            --danger: #ef4444;
            --success: #10b981;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; padding-top: env(safe-area-inset-top, 12px); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px 12px; background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); }
        h1 { font-size: 0.95rem; font-weight: bold; }
        .header-btns { display: flex; gap: 6px; }
        .btn { background: var(--accent); color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        
        .search-area { background: var(--card-bg); padding: 10px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; }
        .search-area input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.85rem; margin-bottom: 8px; }
        .filter-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--muted); flex-wrap: wrap; gap: 6px; }
        .filter-row select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 4px 6px; border-radius: 4px; font-size: 0.75rem; }

        /* オーナー用データ管理バー */
        .owner-control-bar { background: #1e293b; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; display: flex; gap: 6px; align-items: center; justify-content: space-between; }
        .owner-control-bar span { font-size: 0.75rem; color: #fbbf24; font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; }
        
        .card-img-container { width: 100%; height: 140px; background: #000; position: relative; display: grid; gap: 1px; }
        .card-img-container.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .card-img-container.count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .card-img-container.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .card-img-container.count-3 img:first-child { grid-row: span 2; }
        .card-img-container.count-n { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; background: #000; }
        
        .more-img-overlay { position: absolute; bottom: 0; right: 0; background: rgba(0,0,0,0.7); color: white; font-size: 0.65rem; padding: 2px 6px; border-top-left-radius: 6px; font-weight: bold; }

        .sold-badge { position: absolute; top: 6px; left: 6px; background: rgba(239, 68, 68, 0.9); color: white; font-size: 0.65rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; z-index: 2; }
        .stock-badge { position: absolute; top: 6px; right: 6px; background: rgba(15, 23, 42, 0.85); color: #38bdf8; border: 1px solid #0284c7; font-size: 0.65rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; z-index: 2; }

        .card-body { padding: 8px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-tag { font-size: 0.6rem; background: #1e293b; color: var(--muted); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }
        .card-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 2px; }
        .card-sub { font-size: 0.7rem; color: var(--muted); margin-bottom: 2px; }
        .card-price { font-size: 0.8rem; color: #34d399; font-weight: bold; margin-bottom: 6px; }
        .buy-btn { width: 100%; padding: 5px; font-size: 0.7rem; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 4px; }
        .card-actions { display: flex; gap: 6px; margin-top: 6px; }
        .card-actions button { flex: 1; padding: 4px; font-size: 0.7rem; border-radius: 4px; border: none; cursor: pointer; color: white; font-weight: bold; }
        .edit-btn { background: #3b82f6; }
        .del-btn { background: var(--danger); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 16px; z-index: 100; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 340px; padding: 16px; border-radius: 12px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { font-size: 1rem; margin-bottom: 12px; }
        .f-group { margin-bottom: 8px; }
        .f-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; }
        .f-group input, .f-group select { width: 100%; padding: 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.85rem; }
        .modal-row { display: flex; gap: 8px; }
        .modal-btns { display: flex; gap: 8px; margin-top: 12px; }
        .modal-btns button { flex: 1; padding: 8px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .cancel-btn { background: var(--border); color: var(--text); }
        
        #zoom-modal { flex-direction: column; overflow: hidden; padding: 0; background: rgba(0,0,0,0.95); }
        .zoom-scroll-area { width: 100%; height: 80vh; overflow: auto; display: flex; justify-content: center; align-items: center; -webkit-overflow-scrolling: touch; }
        #zoom-img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.2s; transform-origin: center center; }
        .zoom-thumbs { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding: 8px; background: rgba(0,0,0,0.5); width: 100%; }
        .zoom-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; cursor: pointer; opacity: 0.6; flex-shrink: 0; }
        .zoom-thumb.active { border-color: var(--accent); opacity: 1; }
        .zoom-close-bar { position: absolute; top: 12px; right: 12px; z-index: 110; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 id="app-title">TCGコレクション</h1>
            <div style="font-size: 0.65rem; color: var(--muted);" id="app-mode">ゲスト閲覧モード</div>
        </div>
        <button id="auth-btn" class="btn" onclick="toggleAuth()">オーナー認証</button>
    </header>

    <!-- オーナーログイン時だけ表示されるデータ共有・バックアップバー -->
    <div id="owner-share-bar" class="owner-control-bar" style="display: none;">
        <span>📦 データ共有・管理</span>
        <div style="display:flex; gap:4px;">
            <button class="btn btn-success" onclick="exportData()" style="font-size:0.7rem; padding:4px 8px;">📤 シェア・保存</button>
            <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()" style="font-size:0.7rem; padding:4px 8px; background:#475569;">📥 読込</button>
            <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <div class="search-area">
        <input type="text" id="search-input" placeholder="カード名、No.、メモで検索..." oninput="render()">
        <div class="filter-row">
            <div>
                タイトル: 
                <select id="filter-title" onchange="render()">
                    <option value="">すべて</option><option value="遊戯王">遊戯王</option><option value="ポケカ">ポケカ</option><option value="ワンピ">ワンピ</option><option value="デュエマ">デュエマ</option><option value="その他">その他</option>
                </select>
            </div>
            <div>
                順序: 
                <select id="sort-order" onchange="render()">
                    <option value="new">新しい順</option>
                    <option value="price-desc">価格が高い順</option>
                    <option value="price-asc">価格が安い順</option>
                    <option value="stock-desc">在庫が多い順</option>
                </select>
            </div>
            <div id="card-count">0枚</div>
        </div>
    </div>

    <div id="add-bar" style="margin-bottom: 10px; display: none;">
        <button class="btn" style="width: 100%; padding: 10px;" onclick="openModal()">＋ カードを追加</button>
    </div>

    <div class="grid" id="grid"></div>

    <div id="item-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">カード追加</h2>
            <input type="hidden" id="edit-id">
            <div class="f-group">
                <label>カード画像 (最大10枚まで選択可)</label>
                <input type="file" id="f-img" accept="image/*" multiple>
            </div>
            <div class="f-group"><label>タイトル</label><select id="f-title"><option value="遊戯王">遊戯王</option><option value="ポケカ">ポケカ</option><option value="ワンピ">ワンピ</option><option value="デュエマ">デュエマ</option><option value="その他">その他</option></select></div>
            <div class="f-group"><label>カード名</label><input type="text" id="f-name" placeholder="例: 青眼の白龍"></div>
            <div class="modal-row">
                <div class="f-group" style="flex:1;"><label>型番 / No.</label><input type="text" id="f-no" placeholder="例: 001/050"></div>
                <div class="f-group" style="flex:1;"><label>レアリティ</label><input type="text" id="f-rarity" placeholder="例: UR, SAR"></div>
            </div>
            <div class="modal-row">
                <div class="f-group" style="flex:1;"><label>金額 (円)</label><input type="number" id="f-price" placeholder="例: 5000"></div>
                <div class="f-group" style="flex:1;"><label>在庫数 (個/枚)</label><input type="number" id="f-stock" value="1" min="0" placeholder="1"></div>
            </div>
            <div class="f-group"><label>コンディション</label><input type="text" id="f-condition" placeholder="例: 美品(NM)"></div>
            <div class="f-group"><label>メモ (オーナー確認用)</label><input type="text" id="f-memo" placeholder="例: 仕入値や保管場所など"></div>
            <div class="modal-btns">
                <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
                <button class="btn" onclick="saveData()">保存</button>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <h2>オーナー認証</h2>
            <div class="f-group"><label>パスワード</label><input type="password" id="pass-input" placeholder="パスワードを入力"></div>
            <div class="modal-btns">
                <button class="cancel-btn" onclick="closeAuthModal()">キャンセル</button>
                <button class="btn" onclick="verifyPass()">ログイン</button>
            </div>
        </div>
    </div>

    <div id="zoom-modal" class="modal" style="display:none;">
        <button class="btn btn-danger zoom-close-bar" onclick="closeZoom()">✕ 閉じる</button>
        <div class="zoom-scroll-area" id="zoom-scroll-area">
            <img id="zoom-img" src="" onclick="toggleZoomScale()">
        </div>
        <div class="zoom-thumbs" id="zoom-thumbs"></div>
    </div>

    <script>
        let isOwner = sessionStorage.getItem('tcg_owner_session') === 'true';
        let cards = [];
        let currentZoomScale = 1;
        let db;

        const request = indexedDB.open('TCGCollectionDB', 1);
        request.onerror = event => { console.error("DB error: " + event.target.errorCode); };
        request.onsuccess = event => {
            db = event.target.result;
            loadCardsFromDB();
        };
        request.onupgradeneeded = event => {
            const database = event.target.result;
            if (!database.objectStoreNames.contains('cards')) {
                database.createObjectStore('cards', { keyPath: 'id' });
            }
        };

        function loadCardsFromDB() {
            if (!db) return;
            const transaction = db.transaction(['cards'], 'readonly');
            const store = transaction.objectStore('cards');
            const getAllRequest = store.getAll();
            getAllRequest.onsuccess = event => {
                cards = event.target.result || [];
                init();
            };
        }

        function saveCardToDB(cardData, callback) {
            const transaction = db.transaction(['cards'], 'readwrite');
            const store = transaction.objectStore('cards');
            store.put(cardData);
            transaction.oncomplete = () => {
                loadCardsFromDB();
                if (callback) callback();
            };
        }

        function deleteCardFromDB(id, callback) {
            const transaction = db.transaction(['cards'], 'readwrite');
            const store = transaction.objectStore('cards');
            store.delete(id);
            transaction.oncomplete = () => {
                loadCardsFromDB();
                if (callback) callback();
            };
        }

        // データをファイルとして書き出し（シェア用）
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cards));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "tcg_collection_data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // データを読み込み（お客さんが受け取ったファイルを反映用）
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedCards = JSON.parse(e.target.result);
                    if (Array.isArray(importedCards)) {
                        const transaction = db.transaction(['cards'], 'readwrite');
                        const store = transaction.objectStore('cards');
                        // 全てクリアしてインポートデータを反映
                        store.clear();
                        importedCards.forEach(c => store.put(c));
                        transaction.oncomplete = () => {
                            loadCardsFromDB();
                            alert('データを正常に読み込みました！');
                        };
                    } else {
                        alert('ファイル形式が正しくありません');
                    }
                } catch(err) {
                    alert('ファイルの読み込みに失敗しました');
                }
            };
            reader.readAsText(file);
        }

        function init() {
            document.getElementById('app-title').textContent = isOwner ? 'TCGコレクション (オーナー)' : 'TCGコレクション';
            document.getElementById('app-mode').textContent = isOwner ? 'オーナー編集モード' : 'ゲスト閲覧モード';
            const authBtn = document.getElementById('auth-btn');
            authBtn.textContent = isOwner ? 'ログアウト' : 'オーナー認証';
            authBtn.className = isOwner ? 'btn btn-danger' : 'btn';
            document.getElementById('add-bar').style.display = isOwner ? 'block' : 'none';
            document.getElementById('owner-share-bar').style.display = isOwner ? 'flex' : 'none';
            render();
        }

        function toggleAuth() {
            if (isOwner) {
                isOwner = false;
                sessionStorage.removeItem('tcg_owner_session');
                init();
            } else {
                document.getElementById('pass-input').value = '';
                document.getElementById('auth-modal').style.display = 'flex';
            }
        }
        function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }
        function verifyPass() {
            if (document.getElementById('pass-input').value === '19951014') {
                isOwner = true;
                sessionStorage.setItem('tcg_owner_session', 'true');
                closeAuthModal();
                init();
            } else {
                alert('パスワードが違います');
            }
        }

        function render() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const filterTitle = document.getElementById('filter-title').value;
            const sortOrder = document.getElementById('sort-order').value;
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            let filtered = cards.filter(c => {
                const matchKey = (c.name + (c.no||'') + (c.rarity||'') + (c.condition||'') + (c.memo||'') + c.title).toLowerCase().includes(keyword);
                const matchTitle = filterTitle === '' || c.title === filterTitle;
                return matchKey && matchTitle;
            });

            filtered.sort((a, b) => {
                if (sortOrder === 'price-desc') return (Number(b.price)||0) - (Number(a.price)||0);
                if (sortOrder === 'price-asc') return (Number(a.price)||0) - (Number(b.price)||0);
                if (sortOrder === 'stock-desc') return (Number(b.stock)||0) - (Number(a.stock)||0);
                return b.id - a.id;
            });

            document.getElementById('card-count').textContent = filtered.length + '枚';

            filtered.forEach(c => {
                const div = document.createElement('div');
                div.className = 'card';
                
                let imgs = c.imgs || (c.img ? [c.img] : []);
                let stockNum = c.stock !== undefined ? Number(c.stock) : 1;
                
                let imgsHtml = '';
                if (imgs.length > 0) {
                    let countClass = imgs.length === 1 ? 'count-1' : (imgs.length === 2 ? 'count-2' : (imgs.length === 3 ? 'count-3' : 'count-n'));
                    imgsHtml = `<div class="card-img-container ${countClass}">`;
                    let showLimit = Math.min(imgs.length, 4);
                    for(let i=0; i<showLimit; i++) {
                        imgsHtml += `<img src="${imgs[i]}" onclick="openZoom(${c.id}, ${i})">`;
                    }
                    if(imgs.length > 4) {
                        imgsHtml += `<div class="more-img-overlay" onclick="openZoom(${c.id}, 4)">+${imgs.length - 4}枚</div>`;
                    }
                    imgsHtml += `</div>`;
                } else {
                    imgsHtml = `<div class="card-img-container count-1" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.7rem;">No Image</div>`;
                }

                let badgeHtml = '';
                if (stockNum === 0) {
                    badgeHtml += `<div class="sold-badge">SOLD OUT</div>`;
                } else {
                    badgeHtml += `<div class="stock-badge">残り ${stockNum} 個</div>`;
                }

                let priceHtml = isOwner ? 
                    (c.price ? `<div class="card-price">¥${Number(c.price).toLocaleString()}</div>` : '<div class="card-price" style="color:var(--muted);">-</div>') : 
                    `<div class="card-price" style="color:var(--muted);">価格: お問い合わせ</div>`;

                let memoHtml = (isOwner && c.memo) ? `<div style="font-size:0.65rem;color:#fbbf24;margin-bottom:4px;">📝 ${escapeHtml(c.memo)}</div>` : '';

                div.innerHTML = `
                    ${badgeHtml}
                    ${imgsHtml}
                    <div class="card-body">
                        <div>
                            <span class="card-tag">${c.title}</span>
                            <div class="card-title">${escapeHtml(c.name)}</div>
                            <div class="card-sub">${escapeHtml(c.no || '')} ${escapeHtml(c.rarity ? ' / ' + c.rarity : '')}</div>
                            <div class="card-sub">${escapeHtml(c.condition || '')}</div>
                            ${priceHtml}
                            ${memoHtml}
                        </div>
                        <div>
                            ${stockNum > 0 ? `<button class="buy-btn" onclick="inquireCard(${c.id})">💬 問い合わせ・購入</button>` : `<button class="buy-btn" style="background:var(--border);color:var(--muted);cursor:not-allowed;" disabled>売り切れ</button>`}
                            ${isOwner ? `
                                <div class="card-actions">
                                    <button class="edit-btn" onclick="openModal(${c.id})">編集</button>
                                    <button class="del-btn" onclick="delCard(${c.id})">削除</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function inquireCard(id) {
            const c = cards.find(x => x.id === id);
            if (!c) return;
            prompt("以下のメッセージをコピーしてLINEやDMに送信してください：", `【購入希望】${c.name} (No: ${c.no || '-'})`);
        }

        function openModal(id = null) {
            document.getElementById('edit-id').value = id || '';
            if (id) {
                const c = cards.find(x => x.id === id);
                document.getElementById('modal-title').textContent = 'カード編集';
                document.getElementById('f-title').value = c.title;
                document.getElementById('f-name').value = c.name;
                document.getElementById('f-no').value = c.no || '';
                document.getElementById('f-rarity').value = c.rarity || '';
                document.getElementById('f-price').value = c.price || '';
                document.getElementById('f-stock').value = c.stock !== undefined ? c.stock : 1;
                document.getElementById('f-condition').value = c.condition || '';
                document.getElementById('f-memo').value = c.memo || '';
                document.getElementById('f-img').value = '';
            } else {
                document.getElementById('modal-title').textContent = 'カード追加';
                document.getElementById('f-title').value = '遊戯王';
                document.getElementById('f-name').value = '';
                document.getElementById('f-no').value = '';
                document.getElementById('f-rarity').value = '';
                document.getElementById('f-price').value = '';
                document.getElementById('f-stock').value = '1';
                document.getElementById('f-condition').value = '';
                document.getElementById('f-memo').value = '';
                document.getElementById('f-img').value = '';
            }
            document.getElementById('item-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('item-modal').style.display = 'none'; }

        function saveData() {
            const idVal = document.getElementById('edit-id').value;
            const title = document.getElementById('f-title').value;
            const name = document.getElementById('f-name').value;
            const no = document.getElementById('f-no').value;
            const rarity = document.getElementById('f-rarity').value;
            const price = document.getElementById('f-price').value;
            const stock = document.getElementById('f-stock').value;
            const condition = document.getElementById('f-condition').value;
            const memo = document.getElementById('f-memo').value;
            const imgInput = document.getElementById('f-img');

            if (!name) { alert('カード名を入力してください'); return; }

            const files = Array.from(imgInput.files).slice(0, 10);
            const cardId = idVal ? Number(idVal) : Date.now();

            if (idVal) {
                const existing = cards.find(x => x.id === cardId);
                let currentImgs = existing ? (existing.imgs || (existing.img ? [existing.img] : [])) : [];

                if (files.length > 0) {
                    processImages(files, 0, [], newImgs => {
                        saveCardToDB({ id: cardId, title, name, no, rarity, price, stock, condition, memo, imgs: newImgs }, () => {
                            closeModal();
                            render();
                        });
                    });
                } else {
                    saveCardToDB({ id: cardId, title, name, no, rarity, price, stock, condition, memo, imgs: currentImgs }, () => {
                        closeModal();
                        render();
                    });
                }
            } else {
                if (files.length === 0) { alert('画像を少なくとも1枚選択してください'); return; }
                processImages(files, 0, [], newImgs => {
                    saveCardToDB({ id: cardId, title, name, no, rarity, price, stock, condition, memo, imgs: newImgs }, () => {
                        closeModal();
                        render();
                    });
                });
            }
        }

        function processImages(files, index, acc, callback) {
            if (index >= files.length) {
                callback(acc);
                return;
            }
            compressImage(files[index], base64 => {
                acc.push(base64);
                processImages(files, index + 1, acc, callback);
            });
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
            };
        }

        function delCard(id) {
            if (confirm('本当に削除しますか？')) {
                deleteCardFromDB(id, () => {
                    render();
                });
            }
        }

        function openZoom(cardId, imgIndex) {
            const c = cards.find(x => x.id === cardId);
            if (!c) return;
            const imgs = c.imgs || (c.img ? [c.img] : []);
            
            const zoomImg = document.getElementById('zoom-img');
            const zoomThumbs = document.getElementById('zoom-thumbs');
            
            currentZoomScale = 1;
            zoomImg.style.transform = 'scale(1)';
            zoomImg.src = imgs[imgIndex] || '';
            zoomThumbs.innerHTML = '';

            imgs.forEach((src, idx) => {
                const thumb = document.createElement('img');
                thumb.src = src;
                thumb.className = 'zoom-thumb' + (idx === imgIndex ? ' active' : '');
                thumb.onclick = () => {
                    currentZoomScale = 1;
                    zoomImg.style.transform = 'scale(1)';
                    zoomImg.src = src;
                    document.querySelectorAll('.zoom-thumb').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                };
                zoomThumbs.appendChild(thumb);
            });

            document.getElementById('zoom-modal').style.display = 'flex';
        }

        function toggleZoomScale() {
            const zoomImg = document.getElementById('zoom-img');
            if (currentZoomScale === 1) {
                currentZoomScale = 2.5;
                zoomImg.style.transform = 'scale(2.5)';
            } else {
                currentZoomScale = 1;
                zoomImg.style.transform = 'scale(1)';
            }
        }

        function closeZoom() {
            document.getElementById('zoom-modal').style.display = 'none';
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&'`<>]/g, m => ({ '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '<': '&lt;', '>': '&gt;' }[m]));
        }
    </script>
</body>
</html>
